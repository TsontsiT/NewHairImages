<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | New Hair Images</title>
    <style>
        :root { --gold: #D4AF37; --black: #000000; --gray: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--black); color: white; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 0 5%; height: 140px; border-bottom: 2px solid var(--gold); background: var(--black); position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; text-decoration: none; margin-right: 25px; font-weight: bold; text-transform: uppercase; }
        .brand-block { display: flex; align-items: center; gap: 20px; }
        .brand-name { color: var(--gold); font-size: 1.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .logo-container img { height: 120px; }
        .container { padding: 80px 10%; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 60px; }
        h2 { color: var(--gold); margin-bottom: 30px; font-size: 2.5rem; text-transform: uppercase; }
        .info-box h3 { color: var(--gold); margin-bottom: 10px; text-transform: uppercase; }
        .info-box p { margin-bottom: 15px; color: #ccc; }
        input, textarea { width: 100%; padding: 15px; margin-bottom: 20px; background: var(--gray); border: 1px solid var(--gold); color: white; outline: none; }
        button { padding: 18px; background: var(--gold); border: 2px solid var(--gold); font-weight: bold; text-transform: uppercase; width: 100%; cursor: pointer; transition: 0.3s; }
        button:hover { background: transparent; color: var(--gold); }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="brand-block">
            <span class="brand-name">New Hair Images</span>
            <div class="logo-container">
                <img src="1000142962.jpg" alt="New Hair Images Logo">
            </div>
        </div>
    </header>
    <div class="container">
        <div class="info-box">
            <h2>Get In Touch</h2>
            <h3>Address</h3>
            <p>61 Albertyn Street<br>Vorna Valley, Midrand</p>
            <h3>Contact</h3>
            <p>072 766 6313</p>
            <h3>Email</h3>
            <p>Simangele2322@gmail.com</p>
        </div>
        <div class="form-box">
            <h2>Message Us</h2>
            <form>
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <textarea rows="4" placeholder="Job Inquiry or Booking Request"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
