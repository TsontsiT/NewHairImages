<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | New Hair Images</title>
    <style>
        :root { --gold: #D4AF37; --black: #000000; --gray: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--black); color: white; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 0 5%; height: 140px; border-bottom: 2px solid var(--gold); background: var(--black); position: sticky; top: 0; z-index: 1000; }
        nav a { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        .brand-block { display: flex; align-items: center; gap: 20px; }
        .brand-name { color: var(--gold); font-size: 1.8rem; font-weight: bold; text-transform: uppercase; }
        .logo-container img { height: 120px; }
        .container { padding: 80px 10%; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; max-width: 1400px; margin: 0 auto; }
        .contact-info h2 { color: var(--gold); font-size: 2.5rem; text-transform: uppercase; margin-bottom: 30px; }
        .info-block { margin-bottom: 40px; }
        .info-block h3 { color: var(--gold); text-transform: uppercase; margin-bottom: 10px; font-size: 0.9rem; }
        .contact-form { background: #111; padding: 40px; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 15px; margin-bottom: 20px; background: var(--gray); border: 1px solid #444; color: white; }
        .consent-container { display: flex; gap: 12px; margin-bottom: 25px; font-size: 0.85rem; color: #aaa; }
        button { background: var(--gold); color: black; padding: 18px 40px; border: none; font-weight: bold; text-transform: uppercase; width: 100%; cursor: pointer; transition: 0.3s; }
        button:hover { background: #b8952e; }
        footer { padding: 40px 10%; background: var(--black); border-top: 1px solid #333; text-align: center; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a><a href="about.html">About</a><a href="services.html">Services</a><a href="gallery.html">Gallery</a><a href="specials.html">Specials</a><a href="blog.html">Blog</a><a href="contact.html">Contact</a>
        </nav>
        <div class="brand-block">
            <span class="brand-name">New Hair Images</span>
            <div class="logo-container"><img src="1000142962.jpg" alt="Logo"></div>
        </div>
    </header>
    <div class="container">
        <div class="contact-info">
            <h2>Connect With Us</h2>
            <div class="info-block">
                <h3>Our Location</h3>
                <p>61 Albertyn Street, Vorna Valley[cite: 1]</p>
                <p>Midrand, South Africa</p>
            </div>
            <div class="info-block">
                <h3>Direct Contact</h3>
                <p>Phone: 072 766 6313</p>
                <p>Email: Simangele2322@gmail.com</p>
            </div>
        </div>
        <div class="contact-form">
            <form action="mailto:Simangele2322@gmail.com" method="post" enctype="text/plain">
                <input type="text" name="Name" placeholder="Your Name" required>
                <input type="email" name="Email" placeholder="Your Email Address" required>
                <textarea name="Message" rows="5" placeholder="How can we help?"></textarea>
                <div class="consent-container">
                    <input type="checkbox" id="popia" required>
                    <label for="popia">I agree to data processing per the <a href="Privacy_Policy_New_Hair_Images.pdf" target="_blank" style="color: var(--gold);">Privacy Policy</a>.</label>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 New Hair Images. Managed by StooshTech Concepts.</p>
    </footer>
</body>
</html>
